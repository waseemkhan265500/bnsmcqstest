<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Smart MCQs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #333; color: #fff; }
    tr:nth-child(even) { background: #eee; }
    #adminLogin { max-width: 400px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    #adminLogin input { width: 100%; padding: 10px; margin: 10px 0; }
    #adminLogin button { padding: 10px 20px; cursor: pointer; }
    #resultsBox { display: none; }
    #clearBtn { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: red; color: #fff; border: none; border-radius: 5px; }
  </style>
</head>
<body>

  <h1>Admin Panel - Smart MCQs</h1>

  <!-- Admin Login -->
  <div id="adminLogin">
    <h2>Login as Admin</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="loginAdmin()">Login</button>
  </div>

  <!-- Results Table -->
  <div id="resultsBox">
    <h2>All Student Results</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Roll Number</th>
          <th>Score</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="resultsTable"></tbody>
    </table>
    <button id="clearBtn" onclick="clearResults()">Clear All Results</button>
  </div>

  <script>
    // ===== Admin credentials =====
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "12345"; // you can change

    function loginAdmin(){
      let user = document.getElementById("adminUser").value;
      let pass = document.getElementById("adminPass").value;

      if(user === ADMIN_USERNAME && pass === ADMIN_PASSWORD){
        document.getElementById("adminLogin").style.display = "none";
        document.getElementById("resultsBox").style.display = "block";
        loadResults();
      } else {
        alert("Invalid Admin Username or Password!");
      }
    }

    function loadResults(){
      let results = JSON.parse(localStorage.getItem("results")) || [];
      let html = "";
      results.forEach((r,i)=>{
        html += `
          <tr>
            <td>${i+1}</td>
            <td>${r.name}</td>
            <td>${r.roll}</td>
            <td>${r.score}</td>
            <td>${r.date || "-"}</td>
          </tr>
        `;
      });
      document.getElementById("resultsTable").innerHTML = html;
    }

    function clearResults(){
      if(confirm("Are you sure you want to clear all results?")){
        localStorage.removeItem("results");
        loadResults();
      }
    }
  </script>

</body>
</html>

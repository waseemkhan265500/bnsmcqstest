<body>
<h3 id="timer">12:00</h3>

  <img src="9.jpeg" class="logo">

<div id="loginBox">
  <input type="text" id="sname" placeholder="Student Name" required>
  <input type="text" id="roll" placeholder="Roll Number" required>
  <button onclick="startTest()">Start Test</button>
</div>
<h2>Admin Results</h2>
<div id="admin"></div>

<script>
let data = JSON.parse(localStorage.getItem("results")) || [];
let html = "";

data.forEach((r,i)=>{
  html += `<p>${i+1}. ${r.name} (${r.roll}) - Score: ${r.score}</p>`;
});

document.getElementById("admin").innerHTML = html;
</script>


  <!-- Timer -->
